[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "zoroval"
version = "0.1.1"
description = "Trace your LLM app in Zoroval as whole conversations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Zoroval" }]
keywords = ["llm", "observability", "tracing", "opentelemetry", "openai", "anthropic", "evals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-common>=1.30",
  "zstandard>=0.22",
]

[project.scripts]
zoroval = "zoroval.cli.main:main"

[project.urls]
Homepage = "https://zoroval.com"

[tool.hatch.build.targets.wheel]
packages = ["src/zoroval"]

[tool.hatch.build.targets.sdist]
include = ["src/zoroval", "README.md", "LICENSE", "NOTICE"]
